<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Acme Analytics</title>
<style>
  * { box-sizing: border-box }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Segoe UI", sans-serif; color: #1f2937; background: #f3f4f8 }
  header { position: absolute; top: 0; left: 0; right: 0; height: 56px; background: #1e1b4b; color: #fff; display: flex; align-items: center; padding: 0 20px; gap: 12px; font-weight: 700 }
  header .logo { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, #a5b4fc, #6366f1) }
  header .search { margin-left: 40px; width: 320px; height: 32px; border-radius: 8px; background: rgba(255, 255, 255, .12) }
  header .avatar { margin-left: auto; width: 32px; height: 32px; border-radius: 50%; background: #c7d2fe }
  nav { position: absolute; top: 56px; left: 0; bottom: 0; width: 200px; background: #fff; border-right: 1px solid #e5e7eb; padding: 18px 12px }
  nav div { height: 34px; border-radius: 8px; margin-bottom: 6px; display: flex; align-items: center; padding: 0 12px; font-size: 14px; color: #4b5563 }
  nav div.on { background: #eef2ff; color: #4338ca; font-weight: 600 }
  main { position: absolute; top: 56px; left: 200px; right: 0; bottom: 0; overflow-y: auto; padding: 24px 28px }
  h1 { font-size: 22px; margin: 0 0 18px }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px }
  .card { background: #fff; border-radius: 12px; border: 1px solid #e5e7eb; padding: 16px }
  .kpi small { color: #6b7280; font-size: 12px } .kpi b { display: block; font-size: 24px; margin-top: 6px }
  .chart { height: 220px; margin-bottom: 20px; display: flex; align-items: flex-end; gap: 10px; padding: 20px }
  .chart span { flex: 1; border-radius: 6px 6px 0 0; background: linear-gradient(#818cf8, #6366f1) }
  table { width: 100%; border-collapse: collapse; font-size: 13px }
  td, th { text-align: left; padding: 11px 8px; border-bottom: 1px solid #f0f1f5 }
  th { color: #6b7280; font-weight: 600 }
</style>
</head>
<body>
<header><span class="logo"></span>Acme Analytics<span class="search"></span><span class="avatar"></span></header>
<nav><div class="on">Dashboard</div><div>Reports</div><div>Customers</div><div>Products</div><div>Settings</div></nav>
<main>
  <h1>Dashboard</h1>
  <div class="kpis">
    <div class="card kpi"><small>Visitors</small><b>48,210</b></div>
    <div class="card kpi"><small>Conversions</small><b>3,842</b></div>
    <div class="card kpi"><small>Revenue</small><b>$92.4k</b></div>
    <div class="card kpi"><small>Avg. session</small><b>4m 12s</b></div>
  </div>
  <div class="card chart" id="chart"></div>
  <div class="card"><table id="rows"><tr><th>Page</th><th>Views</th><th>Users</th><th>Bounce</th></tr></table></div>
</main>
<script>
  const h = [42, 55, 48, 63, 70, 58, 76, 82, 69, 88, 94, 79]
  chart.innerHTML = h.map((v) => `<span style="height:${v}%"></span>`).join("")
  const pages = ["/", "/pricing", "/blog", "/docs", "/signup", "/features", "/about", "/contact"]
  for (let i = 0; i < 40; i++) {
    rows.insertAdjacentHTML("beforeend",
      `<tr><td>${pages[i % pages.length]}${i >= pages.length ? "/" + (i + 1) : ""}</td><td>${(9800 - i * 173).toLocaleString()}</td><td>${(6100 - i * 97).toLocaleString()}</td><td>${(28 + (i * 7) % 31)}%</td></tr>`)
  }
</script>
</body>
</html>
