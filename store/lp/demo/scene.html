<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>demo</title>
<style>
  * { margin: 0; box-sizing: border-box }
  html, body { width: 1280px; height: 720px; overflow: hidden; font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", sans-serif }
  body { background: linear-gradient(135deg, #eeecfb, #dcd8f6); position: relative }
  #win { position: absolute; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 14px 44px rgba(40, 30, 120, .28), 0 0 0 1px rgba(60, 50, 140, .16) }
  #tabs { height: 28px; background: #dfe3ee; display: flex; align-items: flex-end; padding-left: 10px; font-size: 11.5px; color: #333 }
  #tab { background: #fff; height: 24px; width: 180px; border-radius: 8px 8px 0 0; display: flex; align-items: center; padding: 0 12px; gap: 7px }
  #tab i { width: 11px; height: 11px; border-radius: 3px; background: linear-gradient(135deg, #a5b4fc, #6366f1) }
  #bar { height: 34px; display: flex; align-items: center; padding: 0 10px; gap: 10px; border-bottom: 1px solid #e3e5ec; color: #6b7280 }
  #nav { font-size: 15px; letter-spacing: 7px; white-space: nowrap }
  #url { flex: 1; height: 24px; border-radius: 12px; background: #eef0f5; font-size: 12px; display: flex; align-items: center; padding: 0 14px; color: #444 }
  #ext { position: relative; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center }
  #ext img { width: 16px; height: 16px }
  #badge { position: absolute; right: -5px; bottom: -2px; min-width: 18px; height: 12px; padding: 0 2px; border-radius: 3px; font-size: 9px; font-weight: 700; line-height: 12px; text-align: center; color: #fff; display: none }
  #view { position: relative; overflow: hidden }
  #page { border: 0; transform-origin: 0 0; display: block; background: #fff }
  #outline { position: absolute; border: 3px dashed #6d5ce0; border-radius: 2px; pointer-events: none }
  #tag { position: absolute; background: #5146e5; color: #fff; font-size: 30px; font-weight: 800; padding: 10px 24px; border-radius: 12px; box-shadow: 0 10px 26px rgba(40, 30, 120, .35); white-space: nowrap }
  #popup { position: absolute; display: block; box-shadow: 0 8px 30px rgba(0, 0, 0, .3); background: #fff }
  #card { position: absolute; right: 26px; bottom: 26px; background: #fff; border-radius: 12px; padding: 12px; box-shadow: 0 16px 44px rgba(40, 30, 120, .36) }
  #thumb { overflow: hidden; border: 1px solid #e3e5ec; position: relative }
  #thumb iframe { border: 0; transform-origin: 0 0; display: block; background: #fff }
  #caption { margin-top: 9px; font-size: 13px; color: #555; display: flex; justify-content: space-between; align-items: center; gap: 14px; white-space: nowrap }
  #caption b { color: #5146e5; font-size: 18px }
  #ripple { position: absolute; border: 3px solid #5146e5; border-radius: 50% }
  #cursor { position: absolute; width: 24px; height: 24px; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .35)) }
  #fade { position: absolute; inset: 0; background: #eeecfb }
</style>
</head>
<body>
<div id="win">
  <div id="tabs"><div id="tab"><i></i><span>Acme Analytics</span></div></div>
  <div id="bar"><span id="nav">&#8592;&#8594;&#8635;</span><div id="url">app.example.com/dashboard</div><div id="ext"><img src="icon32.png"><span id="badge"></span></div></div>
  <div id="view"><iframe id="page"></iframe></div>
</div>
<div id="outline"></div>
<div id="tag">1280 &times; 720</div>
<img id="popup">
<div id="card"><div id="thumb"><iframe id="mini"></iframe></div><div id="caption"><span id="file"></span><b id="dims"></b></div></div>
<div id="ripple"></div>
<svg id="cursor" viewBox="0 0 24 24"><path d="M4 2 L4 20 L9 15.5 L12.4 22.5 L15.4 21 L12 14 L18.5 14 Z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>
<div id="fade"></div>
<script>
  // 時刻を渡すと、その瞬間の場面を描く（render.cjs が 1 コマずつ呼ぶ）
  const S = 0.85 // CSS px → 動画の px
  const CHROME = 62 // タブとツールバーの高さ（動画の px）
  const BEFORE = { w: 1400, h: 640 }
  const AFTER = { w: 1280, h: 720 }
  const T = {
    icon1: 1.3, viewport: 2.5, p720: 3.6, resizeEnd: 4.1, tagEnd: 5.5,
    visible: 6.3, ok1: 6.8, cardOut1: 8.6,
    icon2: 9.3, full: 10.3, scrollStart: 10.5, scrollEnd: 12.4, ok2: 12.7, cardOut2: 14.8,
    end: 15.2
  }
  let boxes, lang, pageHeight
  const clamp01 = (v) => Math.min(1, Math.max(0, v))
  const ease = (v) => { v = clamp01(v); return v * v * (3 - 2 * v) }
  const lerp = (a, b, v) => a + (b - a) * v
  const between = (t, a, b) => t >= a && t < b

  window.init = async ({ lang: l, boxes: b, demoHtml }) => {
    lang = l
    boxes = b
    const html = demoHtml
      .replace('new URLSearchParams(location.search).get("lang") === "ja"', l === "ja" ? "true" : "false")
      .replace("</style>", `html, body { height: auto; overflow: visible; position: relative; scroll-behavior: auto }
        ::-webkit-scrollbar { display: none }
        header { position: static } nav { bottom: 0 }
        main { position: static; margin-left: 200px; overflow: visible }
      </style>`)
    const load = (el) => new Promise((ok) => { el.onload = ok; el.srcdoc = html })
    await Promise.all([load(page), load(mini)])
    pageHeight = page.contentDocument.documentElement.scrollHeight
    // 画像を読み込んでおく（途中で切り替えてもちらつかないように）
    await Promise.all(["a", "b", "c"].map((s) => new Promise((ok) => { const i = new Image(); i.onload = ok; i.src = `popup-${l}-${s}.png` })))
    file.textContent = l === "ja" ? "ダウンロード / Captures" : "Downloads / Captures"
    return pageHeight
  }

  const layout = (t) => {
    const r = ease((t - T.p720 - 0.1) / (T.resizeEnd - T.p720 - 0.1))
    const vw = lerp(BEFORE.w, AFTER.w, r), vh = lerp(BEFORE.h, AFTER.h, r)
    const w = vw * S, h = vh * S + CHROME
    const left = 40, top = (720 - h) / 2
    const icon = { x: left + w - 22, y: top + 45 }
    const popW = boxes.root.w * S
    const pop = { x: icon.x + 22 - popW, y: top + CHROME - 2 }
    return { vw, vh, w, h, left, top, icon, pop }
  }
  const inPopup = (box, L) => ({ x: L.pop.x + box.x * S, y: L.pop.y + box.y * S })
  const PATH = [
    { t: 0, at: () => ({ x: 620, y: 430 }) },
    { t: T.icon1, at: (L) => L.icon },
    { t: T.viewport, at: (L) => inPopup(boxes.viewport, L) },
    { t: T.p720, at: (L) => inPopup(boxes.p720, L) },
    { t: 5.0, at: () => ({ x: 560, y: 470 }) },
    { t: T.visible, at: (L) => inPopup(boxes.visibleDownload, L) },
    { t: 7.5, at: () => ({ x: 500, y: 520 }) },
    { t: T.icon2, at: (L) => L.icon },
    { t: T.full, at: (L) => inPopup(boxes.fullDownload, L) },
    { t: 11.4, at: () => ({ x: 480, y: 540 }) },
    { t: T.end, at: () => ({ x: 480, y: 540 }) }
  ]
  const MOVE = 0.75
  const cursorAt = (t, L) => {
    let i = PATH.findIndex((p) => p.t >= t)
    if (i <= 0) return PATH[0].at(L)
    const to = PATH[i], from = PATH[i - 1]
    const start = Math.max(from.t, to.t - MOVE)
    const v = ease((t - start) / (to.t - start))
    const a = from.at(L), b = to.at(L)
    // 少し弧を描いて動かす
    const bow = Math.sin(Math.PI * v) * 14
    return { x: lerp(a.x, b.x, v), y: lerp(a.y, b.y, v) - bow }
  }

  window.seek = (t) => {
    const L = layout(t)
    Object.assign(document.getElementById("win").style, { left: L.left + "px", top: L.top + "px", width: L.w + "px", height: L.h + "px" })
    Object.assign(view.style, { width: L.w + "px", height: L.h - CHROME + "px" })
    Object.assign(page.style, { width: L.vw + "px", height: L.vh + "px", transform: `scale(${S})` })

    // 自動スクロール
    const max = pageHeight - AFTER.h
    const scroll = t < T.scrollStart || t >= T.scrollEnd + 0.15 ? 0 : max * clamp01((t - T.scrollStart) / (T.scrollEnd - T.scrollStart))
    page.contentWindow.scrollTo(0, scroll)

    // ポップアップ
    const open = between(t, T.icon1 + 0.05, T.visible + 0.05) || between(t, T.icon2 + 0.05, T.full + 0.05)
    popup.style.display = open ? "block" : "none"
    if (open) {
      const state = t < T.viewport ? "a" : t < T.p720 ? "b" : "c"
      popup.src = `popup-${lang}-${state}.png`
      Object.assign(popup.style, { left: L.pop.x + "px", top: L.pop.y + "px", width: boxes.root.w * S + "px" })
    }

    // 指定のサイズを見せる枠と札
    const show = ease((t - T.resizeEnd) / 0.2) * (1 - ease((t - T.tagEnd) / 0.25))
    Object.assign(outline.style, { left: L.left + "px", top: L.top + CHROME + "px", width: L.w + "px", height: L.h - CHROME + "px", opacity: show })
    Object.assign(tag.style, { left: L.left + 150 + "px", top: L.top + CHROME + (L.h - CHROME) / 2 - 34 + "px", opacity: show })

    // バッジ
    const busy = between(t, T.visible + 0.05, T.ok1) || between(t, T.full + 0.05, T.ok2)
    const ok = between(t, T.ok1, T.cardOut1) || between(t, T.ok2, T.cardOut2)
    badge.style.display = busy || ok ? "block" : "none"
    badge.textContent = busy ? "..." : "OK"
    badge.style.background = busy ? "#6b7280" : "#16a34a"

    // 保存した画像
    const first = t < T.icon1 + 8
    const inT = first ? T.ok1 : T.ok2, outT = first ? T.cardOut1 : T.cardOut2
    const shown = ease((t - inT) / 0.3) * (1 - ease((t - outT + 0.3) / 0.3))
    const thumbH = first ? 225 : 430
    const srcH = first ? AFTER.h : pageHeight
    const k = thumbH / srcH
    Object.assign(mini.style, { width: AFTER.w + "px", height: srcH + "px", transform: `scale(${k})` })
    Object.assign(thumb.style, { width: AFTER.w * k + "px", height: thumbH + "px" })
    dims.textContent = `1280 × ${srcH}`
    file.style.display = first ? "inline" : "none"
    Object.assign(card.style, { opacity: shown, transform: `translateX(${(1 - shown) * 60}px)`, display: shown > 0 ? "block" : "none" })

    // カーソルとクリック
    const c = cursorAt(t, L)
    Object.assign(cursor.style, { left: c.x - 4 + "px", top: c.y - 2 + "px" })
    const clicks = [T.icon1, T.viewport, T.p720, T.visible, T.icon2, T.full]
    const hit = clicks.find((x) => between(t, x, x + 0.3))
    ripple.style.display = hit === undefined ? "none" : "block"
    if (hit !== undefined) {
      const p = clamp01((t - hit) / 0.3), d = 8 + p * 30
      Object.assign(ripple.style, { left: c.x - d / 2 + "px", top: c.y - d / 2 + "px", width: d + "px", height: d + "px", opacity: 1 - p })
    }

    // 始まりと終わりをなじませてループをつなぐ
    fade.style.opacity = Math.max(1 - ease(t / 0.3), ease((t - T.end + 0.35) / 0.35))
  }
  window.DURATION = T.end
</script>
</body>
</html>
