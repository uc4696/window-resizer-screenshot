<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0 }
  html, body { width: 1200px; height: 750px; overflow: hidden }
  .layer { position: absolute; inset: 0 }
  #frame { position: absolute; background: #fff; border: 1px solid #c9c9c9; box-shadow: 0 4px 14px rgba(0, 0, 0, .18); box-sizing: border-box }
  #popup { position: absolute }
  #tip { position: absolute; background: #202020; color: #fff; font: 15px "Segoe UI", sans-serif; padding: 3px 9px; display: none }
  #iconBg { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: #dedbdd }
  #icon { position: absolute; width: 18px; height: 18px }
  svg { position: absolute; inset: 0 }
</style>
</head>
<body>
<img class="layer" id="bg">
<canvas class="layer" id="patch" width="1200" height="750"></canvas>
<div id="frame"></div>
<img id="popup">
<div id="tip">1920 x 1080</div>
<div id="iconBg"></div>
<img id="icon" src="icon32.png">
<svg width="1200" height="750">
  <defs><filter id="soft"><feGaussianBlur stdDeviation="0.9" /></filter></defs>
  <path id="mark" fill="none" stroke="rgba(122,110,240,.92)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)" />
</svg>
<script>
  // 旧画像のポップアップ部分を新しいポップアップで覆い、手描き風の注釈を描き直す。
  // 位置は旧画像（1200×750）から実測した値。
  const q = new URLSearchParams(location.search)
  const lang = q.get("lang"), step = q.get("step")
  const boxes = JSON.parse(q.get("boxes"))
  const b = boxes[`${lang}-step${step}`]
  // frame: 旧ポップアップを覆う枠 [x, y, w, h] / popup: 新ポップアップの左上 / icon: ツールバーアイコンの中心 / tip: ツールチップの左上
  const S = {
    "ja-2": { bg: "wvr-step-2.png", frame: [717, 59, 363, 676], popup: [719, 61], scale: 1.2, icon: [1059.5, 37.5], tip: [1060, 276] },
    "en-2": { bg: "wvr-step-2-en.png", frame: [706, 70, 358, 657], popup: [709, 73], scale: 1.18, icon: [1043, 51], tip: [1052, 285] },
    "ja-3": { bg: "wvr-step-3.png", frame: [81, 33, 361, 671], popup: [83, 36], scale: 1.19, icon: [420.5, 13.5] },
    "en-3": { bg: "wvr-step-3-en.png", frame: [70, 42, 366, 672], popup: [73, 45], scale: 1.2, icon: [414.5, 22.5] }
  }[`${lang}-${step}`]
  bg.src = S.bg
  Object.assign(frame.style, { left: S.frame[0] + "px", top: S.frame[1] + "px", width: S.frame[2] + "px", height: S.frame[3] + "px" })
  Object.assign(popup.style, { left: S.popup[0] + "px", top: S.popup[1] + "px", width: b.root.w * S.scale + "px" })
  popup.src = `popup-${lang}-step${step}.png`
  // 0.4.0 で濃くしたツールバーアイコンに差し替える（ホバー中の円の色で旧アイコンを消してから重ねる）
  Object.assign(iconBg.style, { left: S.icon[0] - 11 + "px", top: S.icon[1] - 11 + "px" })
  Object.assign(icon.style, { left: S.icon[0] - 9 + "px", top: S.icon[1] - 9 + "px" })
  const at = (box) => ({
    x: S.popup[0] + box.x * S.scale, y: S.popup[1] + box.y * S.scale,
    w: box.w * S.scale, h: box.h * S.scale
  })
  const stroke = (pts) => "M" + pts.map((p) => p.map((v) => v.toFixed(1)).join(" ")).join(" L")
  // 手書きの丸。一筆で少し多めに回り、書き終わりは書き始めの内側に少しずれて重なる。
  // dir は回る向き（1 は時計回り）、end は書き終わりの角度。
  const handLoop = (cx, cy, rx, ry, dir, end) => {
    const pts = [], turn = 2 * Math.PI + 0.6, tilt = -0.08
    for (let i = 0; i <= 120; i++) {
      const p = i / 120, t = end - dir * (1 - p) * turn
      const k = 1.07 - 0.13 * p + 0.012 * Math.sin(5 * t)
      const x = rx * k * Math.cos(t) + 1.5 * p, y = ry * k * Math.sin(t) - 1.2 * p
      pts.push([cx + x * Math.cos(tilt) - y * Math.sin(tilt), cy + x * Math.sin(tilt) + y * Math.cos(tilt)])
    }
    return pts
  }
  mark.setAttribute("stroke-width", "7")
  if (step === "2") {
    // 旧画像に焼き込まれた丸とツールチップ（ポップアップの右）を、すぐ上の何もない帯を引き伸ばして消す
    const right = S.frame[0] + S.frame[2]
    bg.onload = () => {
      patch.getContext("2d").drawImage(bg, right, 170, 1200 - right, 30, right, 222, 1200 - right, 100)
    }
    // FHD ボタンを囲む丸
    const f = at(b.fhd)
    mark.setAttribute("d", stroke(handLoop(f.x + f.w / 2, f.y + f.h / 2, f.w / 2 + 9, f.h / 2 + 9, 1, -1.05)))
    Object.assign(tip.style, { display: "block", left: S.tip[0] + "px", top: S.tip[1] + "px" })
  } else {
    // 旧画像に焼き込まれた矢印を、すぐ上の何もない帯を引き伸ばして消す
    bg.onload = () => {
      const ctx = patch.getContext("2d")
      ctx.drawImage(bg, 430, 346, 176, 24, 430, 396, 176, 100) // ポップアップの右〜サムネイルの左
      ctx.drawImage(bg, 606, 382, 44, 18, 606, 400, 44, 96) // サムネイルの上
    }
    // 表示部分のダウンロードボタンを丸で囲み、そのまま一筆でエクスプローラーへ弧を描く
    const d = at(b.visibleDownload)
    const loop = handLoop(d.x + d.w / 2, d.y + d.h / 2, d.w / 2 + 8, d.h / 2 + 7, -1, 0.7)
    const start = loop[loop.length - 1], tip = [634, 446]
    const c1 = [start[0] + 62, start[1] + 12], c2 = [548, 382]
    const angle = Math.atan2(tip[1] - c2[1], tip[0] - c2[0])
    const barb = (d, l) => [tip[0] - l * Math.cos(angle + d), tip[1] - l * Math.sin(angle + d)]
    mark.setAttribute(
      "d",
      stroke(loop) + ` C ${c1.join(" ")} ${c2.join(" ")} ${tip.join(" ")}` +
        ` M ${barb(0.62, 36).join(" ")} L ${tip.join(" ")} L ${barb(-0.72, 31).join(" ")}`
    )
  }
</script>
</body>
</html>
